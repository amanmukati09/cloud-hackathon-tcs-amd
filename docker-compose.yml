version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aegis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aegis_core.db
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379   # optional, can leave empty for fakeredis
    volumes:
      - ./aegis_core.db:/app/aegis_core.db
      - ./data/chroma:/app/data/chroma
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aegis-frontend
    ports:
      - "7860:7860"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data: